name: CI & Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node --check extension.js
      - run: node --check generator.js
      - run: node test/generator.test.js

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install -g @vscode/vsce
      - name: Package
        run: vsce package --no-dependencies --out moyu-sudoku.vsix
      - name: Check marketplace token
        id: check
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Marketplace
        if: steps.check.outputs.has_token == 'true'
        run: vsce publish --packagePath moyu-sudoku.vsix --skip-duplicate -p "${{ secrets.VSCE_PAT }}"
      - name: Update release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload release moyu-sudoku.vsix --clobber
